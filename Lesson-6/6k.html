<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>Cart Quantity: <span id="quantity">0</span></p>
    <button onclick="
      showQuantity();
    ">Show Quantity</button>
    <button onclick="
      if (cartQuantity + 1 > 10) {
        alert('The cart is full');
      } else {
        cartQuantity++;
        showQuantity();
      }
    ">Add to Cart</button>
    <button onclick="
      if (cartQuantity + 2 > 10) {
        alert('The cart is full');
      } else {
        cartQuantity += 2;
        showQuantity();
      }
    ">+2</button>
    <button onclick="
      if (cartQuantity + 3 > 10) {
        alert('The cart is full');
      } else {
        cartQuantity += 3;
        showQuantity();
      }
    ">+3</button>
    <button onclick="
      if (cartQuantity + 4 > 10) {
        alert('The cart is full');
      } else {
        cartQuantity += 4;
        showQuantity();
      }
    ">+4</button>
    <button onclick="
      if (cartQuantity + 5 > 10) {
        alert('The cart is full');
      } else {
        cartQuantity += 5;
        showQuantity();
      }
    ">+5</button>
    <button onclick="
      if (cartQuantity - 1 < 0) {
        alert('Cart is already empty');
      } else {
        cartQuantity--;
        showQuantity();
      }
    ">Remove from Cart</button>
    <button onclick="
      if (cartQuantity - 2 < 0) {
        alert('Not enough items in cart');
      } else {
        cartQuantity -= 2;
        showQuantity();
      }
    ">-2</button>
    <button onclick="
      if (cartQuantity - 3 < 0) {
        alert('Not enough items in cart');
      } else {
        cartQuantity -= 3;
        showQuantity();
      }
    ">-3</button>
    <button onclick="
      cartQuantity = 0;
      showQuantity();
    ">Reset Cart</button>
    <script>
      let cartQuantity = 0;
      function showQuantity() {
        document.getElementById('quantity').textContent = cartQuantity;
      }
    </script>
  </body>
</html>
